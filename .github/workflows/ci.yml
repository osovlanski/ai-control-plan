name: CI

on:
  push:
    branches: [main, spike/codex-session-input-correlated-receipts]
    paths:
      - ".github/workflows/ci.yml"
      - "apps/api/**"
      - "packages/adapters/**"
      - "packages/core/**"
      - "docs/codex-session-input-correlated-receipts.md"
      - "docs/session-input-stack-normalization.md"
      - "docs/evidence/codex-correlated-**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test (single mode forced ON)
        run: pnpm test:harness-on
        env:
          AGENT_PLANE_HARNESS_SINGLE_MODE: "1"

      - name: Recovery chaos
        run: pnpm test:recovery-chaos

      - name: Build
        run: pnpm build
