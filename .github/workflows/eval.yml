name: Eval

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    # Non-blocking: this never gates a PR or a push to main. It is the
    # credential-gated real-provider eval program (increment 3,
    # docs/agentic-os-eval-plan.md areas 1/2/6), separate from the per-PR
    # fakes-only pnpm test / test:harness-on / test:recovery-chaos.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run eval
        env:
          AGENT_PLANE_EVAL: "1"
          # M16 K19i: every scenario's tool calls, for the floor discovery step below.
          AGENT_PLANE_EVAL_TOOL_ACTIONS: ${{ github.workspace }}/eval/out/tool-actions.jsonl
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: mkdir -p eval/out && pnpm eval

      # M16 §7.2: the prompt-injection suites bind only where a judge is
      # reachable. Per-PR CI is credential-free, so there they are vacuous and
      # say so; this is the run that measures the real judge. The judge is
      # nondeterministic, so the verdict is a FREQUENCY over 5 runs, not one
      # run's pass/fail (K19h): each run writes one row per fixture, and
      # decision:injection-frequency applies the bar (a gate flip or a risk
      # cross in ≥ 2 of 5 judged runs fails; fewer than 5 judged runs is
      # INCOMPLETE, which is not a pass). A single run's own exit is kept in the
      # log but does not decide the step. A red verdict opens the issue below.
      # The rows hold answers and outcomes only, never decision state; they are
      # uploaded with the scorecard.
      #
      # K19i: manual dispatch only. The judge no longer gates (floors decide),
      # so this bar has no activation consequence, and it FAILS by construction
      # (32 fixtures already reached it in K19h), which would open the issue
      # every night. The gate's own injection check is now deterministic and
      # per-PR (`decision-second-lock.test.ts`: no carrier removes a floor).
      - name: Prompt-injection suites against the real judge, 5 runs (M16 §7.2)
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash # explicit, so GitHub adds pipefail and the verdict's exit survives `tee`
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out="$PWD/eval/out/decision-injection"
          mkdir -p "$out"
          for i in 1 2 3 4 5; do
            DECISION_EVAL_JSONL="$out/run$i.jsonl" \
              pnpm --filter @agent-plane/api exec vitest run test/decision-injection.test.ts test/decision-second-lock.test.ts \
              || echo "run $i: vitest exited non-zero (unjudged decisions); the frequency bar below decides"
            touch "$out/run$i.jsonl"
          done
          pnpm --filter @agent-plane/api decision:injection-frequency "$out"/run*.jsonl | tee "$out/verdict.txt"

      # M16 K19i: the judge's only job. It reads the tool calls tonight's
      # scenarios made, skips every call a floor already prompts on, asks the
      # judge about the rest, and writes floor CANDIDATES for a human to accept
      # (uploaded with the scorecard). It proposes and never gates: nothing it
      # writes is read by the tool gate. No key means "no judgement ran", said
      # in the file; that is not a failure of this step.
      - name: Floor discovery — the judge proposes floors, offline (M16 K19i)
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          touch eval/out/tool-actions.jsonl
          pnpm --filter @agent-plane/api decision:floor-discovery \
            --actions "$PWD/eval/out/tool-actions.jsonl" --out "$PWD/eval/out/floor-candidates.md"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard-${{ github.run_id }}
          path: eval/out/
          retention-days: 90

      # Promotion is manual-dispatch only — never every nightly (plan §4 step
      # 23) — so docs/eval-history/ doesn't churn on every scheduled run.
      - name: Promote scorecard to docs/eval-history/
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm eval:promote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/eval-history/
          git diff --cached --quiet || git commit -m "docs: promote eval scorecard ($(date -u +%Y-%m-%d))"
          git push

      - name: Open an issue on a red run
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly eval failed";
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "nightly-eval",
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["nightly-eval"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body,
              });
            }
