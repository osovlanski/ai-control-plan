    acceptance:
      commands:
        - { run: "npm ci --offline --no-audit --no-fund", replaySafe: true, timeoutSec: 600 }
        - { run: "npm test", replaySafe: false, timeoutSec: 1800 }
        - { run: "npm run build", replaySafe: true, timeoutSec: 600 }
