        - { run: "pnpm install --offline --frozen-lockfile", replaySafe: true, timeoutSec: 600 }
        - { run: "pnpm typecheck", replaySafe: true, timeoutSec: 900 }
        - { run: "pnpm lint", replaySafe: true, timeoutSec: 900 }
