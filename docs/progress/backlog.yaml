# Agentic OS backlog: desired work for ai-control-plan and cockpit (auto copilot plan §C.3).
#
# Rules (enforced by `node scripts/backlog-check.mjs`; field reference in README.md):
# - No status field. Status is derived from GitHub (os/<id> ref, its PR) and plane attempts.
# - `id` is stable forever and becomes the GitHub ref os/<id>. Renaming an item is a new item.
# - Only open work is listed. Shipped slices (P0-A2, P0-2, ...) are in docs/PROJECT_MEMORY.md.
# - lane oci-loop: the OCI autopilot may pick it up. It needs acceptance commands, each with an
#   explicit replaySafe, and the writable paths of the offline snapshot (§C.2.7).
# - lane manual-cloud: a Claude Code or Codex cloud thread reserves os/<id> first (§C.4).
# - lane owner: only itay can do it (a host step, a secret, a login or a decision).
# - Acceptance commands come from this file at origin/main, never from the task worktree.
#
# Audited 2026-11-13 at ai-control-plan 08ba95b and cockpit 2c19d12 (no open PRs in either).
