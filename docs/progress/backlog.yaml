        - "apps/web/node_modules"
        - "packages/core/node_modules"
        - "packages/adapters/node_modules"
        - "eval/node_modules"
      drive: "A legacy-path (harnessModes.single false) fake-provider run whose run.started carries a CLI version leaves runs.harness_cli_version set."

  - id: memory-stale-boundary
    title: "Cockpit memory Garden: stale means older than staleDays, as the memory v1 contract says"
    phase: "O6 follow-up"
    repo: cockpit
    size: S
    depends_on: []
    files: ["memoryGarden.ts", "memoryGarden.test.ts"]
    lane: oci-loop
    profile: auto
    night: true
    source: "O6 S2 review finding (cockpit #49); verified 2026-11-13: memoryGarden.ts skips only ageDays < staleDays, so exactly staleDays is stale"
    notes: "README says 'longer than staleDays' too. Contract-text alignment, no contract change."
    acceptance:
      commands:
        - { run: "npm ci --offline --no-audit --no-fund", replaySafe: true, timeoutSec: 600 }
        - { run: "npm test", replaySafe: false, timeoutSec: 1800 }
        - { run: "npm run build", replaySafe: true, timeoutSec: 600 }
      writable: &cockpit-writable
        - "node_modules"
        - ".generated"
        - { file: "memory-garden-status.json" }
        - { file: "retro-action-status.json" }
      drive: "A memory file aged exactly staleDays is not reported stale; staleDays + 1 is."

